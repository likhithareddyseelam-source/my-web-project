<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Frozen Vegetables</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      min-height: 100vh;
      background: linear-gradient(45deg, #6be585, #4ecdc4, #2dd2b1, #88d498);
      background-size: 500% 500%;
      animation: gradientBG 15s ease infinite;
      overflow-x: hidden;
      position: relative;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    header {
      text-align: center;
      padding: 60px 20px 20px;
      font-size: 44px;
      font-weight: bold;
      text-shadow: 2px 2px 10px #2c2c2c70;
      animation: fadeDown 1.5s ease-out;
    }

    .tagline {
      text-align: center;
      font-size: 22px;
      margin-bottom: 40px;
      padding: 0 20px;
      color: #dfffe7;
      animation: fadeDown 2s ease-out;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 40px;
      padding: 40px 20px 60px;
      max-width: 1200px;
      margin: auto;
    }

    .card {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 25px 20px;
      text-align: center;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      animation: floatIn 1.2s ease forwards;
      animation-delay: calc(var(--i) * 0.3s);
      opacity: 0;
    }

    .card:hover {
      transform: scale(1.05);
      transition: 0.4s ease;
    }

    .card img {
      width: 100%;
      border-radius: 15px;
      margin-bottom: 20px;
      border: 2px solid #fff;
    }

    .card h3 {
      font-size: 22px;
      color: #fff;
      text-shadow: 1px 1px 5px #000;
    }

    .card button {
      margin-top: 15px;
      padding: 12px 25px;
      font-size: 15px;
      border: none;
      border-radius: 20px;
      background: #fff;
      color: #28a745;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .card button:hover {
      background: #d4ffd9;
      transform: scale(1.05);
    }

    .home-btn {
      display: block;
      margin: 40px auto 20px;
      padding: 14px 35px;
      font-size: 20px;
      background-color: #fff;
      color: #d63384;
      font-weight: bold;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      transition: 0.3s ease;
      text-decoration: none;
    }

    .home-btn:hover {
      background-color: #ffd6e0;
      color: #000;
      transform: scale(1.05);
    }

    footer {
      text-align: center;
      padding: 30px 10px;
      font-size: 16px;
      color: #ffffffc9;
    }

    @keyframes floatIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      header { font-size: 32px; }
    }

    /* Snow */
    .snow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .snowflake {
      position: absolute;
      color: white;
      font-size: 1em;
      user-select: none;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
    }

    /* Cart Modal */
    .cart-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      color: #000;
      padding: 30px 40px;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      display: none;
      z-index: 999;
      width: 300px;
      max-width: 90%;
    }

    .cart-popup h2 {
      margin-bottom: 15px;
    }

    .cart-popup ul {
      list-style: none;
      padding: 10px 0;
      margin-bottom: 15px;
      max-height: 200px;
      overflow-y: auto;
    }

    .cart-popup li {
      margin-bottom: 10px;
    }

    .cart-popup button {
      padding: 12px 24px;
      font-size: 16px;
      margin-top: 10px;
      background: #28a745;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .view-cart-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #fff;
      color: #28a745;
      border: none;
      padding: 10px 20px;
      border-radius: 30px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      z-index: 1000;
    }

    .view-cart-btn:hover {
      background-color: #d4ffd9;
    }
  </style>
</head>
<body>

  <header>🥦 Frozen Vegetables Heaven 🥕</header>
  <div class="tagline">Freshness locked in every bite — straight from nature to your freezer!</div>

  <button class="view-cart-btn" onclick="showCart()">🛒 View Cart</button>

  <div class="container">
    <div class="card" style="--i:1;">
      <img src="https://5.imimg.com/data5/SELLER/Default/2020/12/OM/ZU/BN/119495321/frozen-green-peas.jpg" alt="Peas">
      <h3>Green Peas - ₹40</h3>
      <button onclick="addToCart('Green Peas', 40)">Add to Cart</button>
    </div>
    <div class="card" style="--i:2;">
      <img src="https://media.istockphoto.com/id/827379248/photo/fresh-frozen-broccoli-on-white-plate.jpg?s=612x612&w=0&k=20&c=aNUg-iW55Hme--1ZGhn3AYpOFqGxFq7_-ymEU9jSRis=" alt="Broccoli">
      <h3>Fresh Broccoli - ₹60</h3>
      <button onclick="addToCart('Fresh Broccoli', 60)">Add to Cart</button>
    </div>
    <div class="card" style="--i:3;">
      <img src="https://frutteto.in/wp-content/uploads/2020/03/frozen-carrot.jpg" alt="Carrots">
      <h3>Frozen Carrots - ₹35</h3>
      <button onclick="addToCart('Frozen Carrots', 35)">Add to Cart</button>
    </div>
    <div class="card" style="--i:4;">
      <img src="https://www.mjandhungryman.com/wp-content/uploads/2023/11/Frozen-mixed-veggies.jpg" alt="Mixed Veggies">
      <h3>Mixed Vegetables - ₹50</h3>
      <button onclick="addToCart('Mixed Vegetables', 50)">Add to Cart</button>
    </div>
  </div>

  <a class="home-btn" href="jyo.html">← Back to Home</a>

  <footer>© 2025 FrozenApp. All Rights Reserved.</footer>

  <!-- Snow -->
  <div class="snow" id="snowContainer"></div>

  <!-- Cart Modal -->
  <div class="cart-popup" id="cartPopup">
    <h2>Your Cart</h2>
    <ul id="cartItems"></ul>
    <p><strong>Total: ₹<span id="totalAmount">0</span></strong></p>
    <button onclick="checkout()">Checkout</button>
  </div>

  <script>
    const snowContainer = document.getElementById('snowContainer');
    for (let i = 0; i < 60; i++) {
      const flake = document.createElement('div');
      flake.classList.add('snowflake');
      flake.innerHTML = '❄️';
      flake.style.left = Math.random() * 100 + 'vw';
      flake.style.animationDuration = (Math.random() * 3 + 2) + 's';
      flake.style.fontSize = (Math.random() * 10 + 10) + 'px';
      flake.style.animationDelay = Math.random() * 5 + 's';
      snowContainer.appendChild(flake);
    }

    const cart = {};

    function addToCart(item, price) {
      if (!cart[item]) {
        cart[item] = { price, quantity: 1 };
      } else {
        cart[item].quantity++;
      }
      alert(item + " added to cart!");
    }

    function showCart() {
      const popup = document.getElementById("cartPopup");
      const cartItems = document.getElementById("cartItems");
      const totalAmount = document.getElementById("totalAmount");
      cartItems.innerHTML = '';
      let total = 0;

      for (let item in cart) {
        const li = document.createElement('li');
        const itemData = cart[item];
        li.textContent = `${item} - ₹${itemData.price} x ${itemData.quantity}`;
        cartItems.appendChild(li);
        total += itemData.price * itemData.quantity;
      }

      totalAmount.textContent = total;
      popup.style.display = 'block';
    }

    function checkout() {
      alert("Order placed successfully!");
      document.getElementById("cartPopup").style.display = "none";
      for (let key in cart) delete cart[key];
    }

    // Close popup on outside click
    window.onclick = function(e) {
      const popup = document.getElementById("cartPopup");
      if (e.target === popup) popup.style.display = "none";
    };
  </script>

</body>
</html>
