<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🍓 Frozen Ice-creams</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Baloo 2', cursive;
    }
    body {
      background: linear-gradient(to right, #fff1f1, #fef6e4);
      color: #333;
      overflow-x: hidden;
      position: relative;
    }
    header {
      background: #ff69b4;
      padding: 20px 0;
      text-align: center;
      color: white;
      font-size: 36px;
      font-weight: bold;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      letter-spacing: 1px;
    }
    .container {
      padding: 40px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
    }
    .icecream-card {
      width: 300px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(255, 182, 193, 0.4);
      overflow: hidden;
      text-align: center;
      transition: transform 0.3s ease;
    }
    .icecream-card:hover {
      transform: scale(1.05);
    }
    .icecream-card img {
      width: 100%;
      height: 230px;
      object-fit: cover;
    }
    .icecream-info {
      padding: 15px;
    }
    .icecream-name {
      font-size: 20px;
      color: #d81b60;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .icecream-price {
      font-size: 18px;
      color: #43a047;
      font-weight: 600;
    }
    .order-btn {
      background-color: #ff69b4;
      color: white;
      border: none;
      padding: 10px 20px;
      margin: 10px auto;
      border-radius: 20px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .order-btn:hover {
      background-color: #d81b60;
      transform: scale(1.05);
    }
    .home-btn {
      display: inline-block;
      margin: 20px 10px;
      padding: 14px 40px;
      font-size: 18px;
      background-color: #fff;
      color: #d63384;
      font-weight: bold;
      border: 2px solid #ff69b4;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
      text-decoration: none;
    }
    .home-btn:hover {
      background-color: #ff69b4;
      color: white;
      transform: scale(1.05);
    }
    footer {
      background: #ff69b4;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 40px;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 10000;
    }
    .modal-content {
      background: #fff;
      padding: 20px;
      border-radius: 20px;
      text-align: center;
      width: 90%;
      max-width: 500px;
    }
    .close-btn, .submit-btn, .print-btn {
      background-color: crimson;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      margin: 10px;
    }
    .submit-btn {
      background-color: #43a047;
    }
    .print-btn {
      background-color: #007bff;
    }
    ul { text-align: left; }
    .snowflake {
      color: white;
      font-size: 1.5em;
      position: fixed;
      top: -10px;
      z-index: 9999;
      user-select: none;
      pointer-events: none;
      animation: fall linear infinite;
    }
    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
    }
    input[type="text"], input[type="tel"] {
      width: 80%;
      padding: 8px;
      margin: 5px;
      border: 1px solid #ccc;
      border-radius: 10px;
    }
    .remove-btn {
      background-color: #ff5252;
      border: none;
      color: white;
      padding: 3px 10px;
      border-radius: 8px;
      margin-left: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>🍦 Frozen Ice-creams</header>
  <div class="container" id="productContainer">
    <!-- Cards will be generated by JS -->
  </div>

  <div style="text-align:center">
    <a class="home-btn" href="jyo.html">← Back to Home</a>
    <button class="home-btn" onclick="openCart()">🛒 View Cart</button>
  </div>

  <footer>© 2025 Frozen Delights. All Rights Reserved.</footer>

  <!-- Cart Modal -->
  <div class="modal" id="cartModal">
    <div class="modal-content" id="cartContent">
      <h3>Your Cart</h3>
      <ul id="cartItems"></ul>
      <input type="text" id="username" placeholder="Your Name" required>
      <input type="text" id="address" placeholder="Delivery Address" required>
      <input type="tel" id="phone" placeholder="Phone Number" required>
      <input type="text" id="discountCode" placeholder="Discount Code (if any)">
      <div id="totalPrice" style="margin-top:10px;font-weight:bold;"></div>
      <button class="submit-btn" onclick="submitOrder()">Submit Order</button>
      <button class="print-btn" onclick="window.print()">🖨️ Print Invoice</button>
      <button class="close-btn" onclick="closeCart()">Close</button>
    </div>
  </div>

  <script>
    const products = [
      { name: 'Strawberry', price: 80, image: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTzWrFmW9sLwcjF6YlWpkXhBIve1i8SCQYZVg&s' },
      { name: 'Apple', price: 90, image: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTC7t4QThSrjAuifZiRZFUwbb7shgLHFHRetA&s' },
      { name: 'Mango', price: 70, image: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSWEnkEAvNRs_0VblZJ2_SRygmjWRy-sqn2fQ&s' },
      { name: 'Orange', price: 100, image: 'https://img.delicious.com.au/1AJaxeDX/del/2022/02/golden-gaytime-ice-cream-slice-207898-2.jpg' }
    ];

    const cart = [];

    function renderProducts() {
      const container = document.getElementById('productContainer');
      products.forEach(p => {
        const card = document.createElement('div');
        card.className = 'icecream-card';
        card.innerHTML = `
          <img src="${p.image}" alt="${p.name}">
          <div class="icecream-info">
            <div class="icecream-name">${p.name}</div>
            <div class="icecream-price">₹${p.price}</div>
            <button class="order-btn" onclick="addToCart('${p.name}', ${p.price})">Add to Cart</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function addToCart(name, price) {
      cart.push({ name, price });
      alert(name + " added to cart!");
    }

    function openCart() {
      const modal = document.getElementById("cartModal");
      const list = document.getElementById("cartItems");
      list.innerHTML = "";
      let total = 0;
      if (cart.length === 0) {
        list.innerHTML = "<li>No items in cart.</li>";
      } else {
        cart.forEach((item, index) => {
          total += item.price;
          list.innerHTML += `<li>${item.name} - ₹${item.price} 
            <button class="remove-btn" onclick="removeFromCart(${index})">✖</button></li>`;
        });
      }
      document.getElementById("totalPrice").innerText = "Total: ₹" + total;
      modal.style.display = "flex";
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      openCart(); // re-render cart
    }

    function closeCart() {
      document.getElementById("cartModal").style.display = "none";
    }

    function submitOrder() {
      if (cart.length === 0) {
        alert("Cart is empty!");
        return;
      }
      const name = document.getElementById("username").value;
      const addr = document.getElementById("address").value;
      const phone = document.getElementById("phone").value;
      const discount = document.getElementById("discountCode").value.trim();
      if (!name || !addr || !phone) {
        alert("Please fill in all delivery details.");
        return;
      }
      let total = cart.reduce((sum, item) => sum + item.price, 0);
      if (discount === "SAVE10") {
        total *= 0.9;
        alert("Discount applied! 10% off.");
      }
      alert(`Thanks ${name}! Your order of ₹${total.toFixed(2)} has been placed.`);
      cart.length = 0;
      closeCart();
    }

    function createSnowflake() {
      const snowflake = document.createElement('div');
      snowflake.classList.add('snowflake');
      snowflake.innerText = '❄';
      snowflake.style.left = Math.random() * window.innerWidth + 'px';
      snowflake.style.animationDuration = (2 + Math.random() * 3) + 's';
      snowflake.style.opacity = Math.random();
      snowflake.style.fontSize = (10 + Math.random() * 20) + 'px';
      document.body.appendChild(snowflake);
      setTimeout(() => snowflake.remove(), 5000);
    }
    setInterval(createSnowflake, 200);

    window.onload = renderProducts;
  </script>
</body>
</html>
