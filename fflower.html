<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Frozen Flowers</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      min-height: 100vh;
      background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #fbc2eb, #a18cd1);
      background-size: 500% 500%;
      animation: backgroundMove 15s ease infinite;
      overflow-x: hidden;
      position: relative;
    }

    @keyframes backgroundMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    header {
      text-align: center;
      padding: 40px 20px 10px;
      font-size: 42px;
      font-weight: bold;
      text-shadow: 2px 2px 10px #00000060;
      animation: dropIn 1.5s ease-out;
      z-index: 2;
      position: relative;
    }

    .tagline {
      text-align: center;
      font-size: 20px;
      margin-bottom: 30px;
      color: #fff5f5;
      animation: dropIn 2s ease-out;
      z-index: 2;
      position: relative;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 30px;
      padding: 30px;
      max-width: 1200px;
      margin: auto;
      z-index: 2;
      position: relative;
    }

    .card {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      transform: translateY(100px);
      animation: floatUp 1.2s ease forwards;
      animation-delay: calc(var(--i) * 0.3s);
      opacity: 0;
    }

    .card:hover {
      transform: scale(1.05);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }

    .card img {
      width: 100%;
      border-radius: 15px;
      margin-bottom: 15px;
      border: 2px solid #fff;
    }

    .card h3 {
      font-size: 22px;
      color: #fff;
      text-shadow: 1px 1px 5px #000;
    }

    .add-cart {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 16px;
      background-color: #fff;
      color: #d63384;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    .add-cart:hover {
      background-color: #ffd6e0;
      transform: scale(1.05);
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 16px;
      color: #ffffffc9;
      z-index: 2;
      position: relative;
    }

    .home-btn {
      display: block;
      margin: 30px auto 10px;
      padding: 12px 30px;
      font-size: 18px;
      background-color: #fff;
      color: #d63384;
      font-weight: bold;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .home-btn:hover {
      background-color: #ffd6e0;
      color: #000;
      transform: scale(1.05);
    }

    .order-box {
      background-color: rgba(255,255,255,0.1);
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      text-align: center;
    }

    .order-box h2 {
      font-size: 26px;
      margin-bottom: 15px;
      color: #fff;
    }

    #cartItems {
      list-style: none;
      padding: 0;
      margin: 0 0 10px;
    }

    #cartItems li {
      background-color: rgba(255,255,255,0.2);
      margin: 8px auto;
      padding: 10px;
      border-radius: 15px;
      width: 80%;
      color: #fff;
    }

    .total {
      font-size: 18px;
      margin-top: 10px;
      color: #fff;
    }

    .place-order-btn {
      margin-top: 15px;
      padding: 10px 25px;
      font-size: 16px;
      background-color: #fff;
      color: #d63384;
      font-weight: bold;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .place-order-btn:hover {
      background-color: #ffd6e0;
      color: #000;
      transform: scale(1.05);
    }

    @keyframes floatUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes dropIn {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 768px) {
      header {
        font-size: 32px;
      }
    }

    /* Snowfall effect */
    .snow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .snowflake {
      position: absolute;
      color: white;
      font-size: 1em;
      user-select: none;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% {
        transform: translateY(-10px) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(100vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <header>🌸 Frozen Flowers Collection 🌼</header>
  <div class="tagline">Elegance preserved — nature’s beauty in eternal bloom.</div>

  <div class="container">
    <div class="card" style="--i:1;">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR0IUw5QJoawk5HDvkl-AjZ2rv8iufJMVAg-Q&s" alt="Roses">
      <h3>Frozen Roses</h3>
      <button class="add-cart" onclick="addToCart('Frozen Roses')">Add to Cart</button>
    </div>
    <div class="card" style="--i:2;">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ3pmTexmNcU-b6TGy__09iXSGNlYhb3wajKA&s" alt="Tulips">
      <h3>Frozen Tulips</h3>
      <button class="add-cart" onclick="addToCart('Frozen Tulips')">Add to Cart</button>
    </div>
    <div class="card" style="--i:3;">
      <img src="https://thumbs.dreamstime.com/b/image-frost-covered-pink-tulips-sunrise-captivating-close-up-frozen-flowers-dreamy-morning-light-image-frost-348787851.jpg" alt="Lilies">
      <h3>Frozen Lilies</h3>
      <button class="add-cart" onclick="addToCart('Frozen Lilies')">Add to Cart</button>
    </div>
    <div class="card" style="--i:4;">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRn0H76e6Ya22ssGrhxC5bE8kEO9tKA88tPSg&s" alt="Bouquet">
      <h3>Frozen Bouquets</h3>
      <button class="add-cart" onclick="addToCart('Frozen Bouquets')">Add to Cart</button>
    </div>
  </div>

  <!-- Cart & Order Details Section -->
  <div class="order-box" id="orderBox">
    <h2>🛍️ Your Cart</h2>
    <ul id="cartItems"></ul>
    <p class="total">Total Items: <span id="totalItems">0</span></p>
    <button class="place-order-btn" onclick="placeOrder()">Place Order</button>
  </div>

  <!-- Back to Home Button -->
  <a class="home-btn" href="jyo.html">← Back to Home</a>

  <footer>© 2025 FrozenApp. All Rights Reserved.</footer>

  <!-- Snow JavaScript -->
  <div class="snow" id="snowContainer"></div>

  <script>
    const snowContainer = document.getElementById('snowContainer');
    const snowflakes = 60;

    for (let i = 0; i < snowflakes; i++) {
      const flake = document.createElement('div');
      flake.classList.add('snowflake');
      flake.innerHTML = '❄️';
      flake.style.left = Math.random() * 100 + 'vw';
      flake.style.animationDuration = (Math.random() * 3 + 2) + 's';
      flake.style.fontSize = (Math.random() * 10 + 10) + 'px';
      flake.style.animationDelay = Math.random() * 5 + 's';
      snowContainer.appendChild(flake);
    }

    // Cart Functionality
    let cart = [];

    function addToCart(item) {
      cart.push(item);
      updateCartDisplay();
    }

    function updateCartDisplay() {
      const cartItems = document.getElementById("cartItems");
      const totalItems = document.getElementById("totalItems");

      cartItems.innerHTML = "";
      cart.forEach((item, index) => {
        const li = document.createElement("li");
        li.textContent = `${index + 1}. ${item}`;
        cartItems.appendChild(li);
      });

      totalItems.textContent = cart.length;
    }

    function placeOrder() {
      if (cart.length === 0) {
        alert("Your cart is empty! Please add some frozen flowers.");
        return;
      }

      alert(`Thank you for your order of ${cart.length} item(s)!`);
      cart = [];
      updateCartDisplay();
    }
  </script>

</body>
</html>
