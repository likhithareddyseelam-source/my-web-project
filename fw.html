<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Frozen Fruits</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to top, #b0e0e6, #ffffff);
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      padding: 2rem;
      background-color: #0077b6;
      color: white;
    }

    h1 {
      margin: 0;
      font-size: 2.5rem;
      text-shadow: 1px 1px 4px #444;
    }

    .fruits-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 2rem;
      padding: 2rem;
      max-width: 1200px;
      margin: auto;
    }

    .fruit-card {
      background-color: #ffffffcc;
      padding: 1rem;
      border-radius: 1.5rem;
      box-shadow: 0 8px 15px rgba(0,0,0,0.1);
      text-align: center;
      transition: transform 0.3s ease;
      position: relative;
    }

    .fruit-card:hover {
      transform: scale(1.05);
    }

    .fruit-card img {
      width: 100%;
      border-radius: 1rem;
      max-height: 200px;
      object-fit: cover;
    }

    .fruit-card h3 {
      margin: 0.5rem 0 0.2rem;
      font-size: 1.2rem;
    }

    .fruit-card p {
      margin: 0.2rem 0;
    }

    .fruit-card button {
      margin-top: 0.5rem;
      padding: 0.5rem 1rem;
      background-color: #00b4d8;
      border: none;
      color: white;
      border-radius: 1rem;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .fruit-card button:hover {
      background-color: #0077b6;
    }

    .view-cart-btn {
      display: inline-block;
      margin: 1rem 0.5rem;
      padding: 0.7rem 1.2rem;
      font-size: 1rem;
      background-color: #0077b6;
      color: white;
      border: none;
      border-radius: 1rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .view-cart-btn:hover {
      background-color: #005f87;
    }

    .back-home {
      text-align: center;
      margin-bottom: 2rem;
    }

    .back-home a {
      padding: 0.7rem 1.5rem;
      background-color: #023e8a;
      color: white;
      border-radius: 1.5rem;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.3s ease;
    }

    .back-home a:hover {
      background-color: #001f5c;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0; top: 0;
      width: 100%; height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.5);
    }

    .modal-content {
      background-color: #fefefe;
      margin: 10% auto;
      padding: 2rem;
      border: 1px solid #888;
      width: 80%;
      max-width: 500px;
      border-radius: 1.5rem;
      position: relative;
    }

    .close {
      color: #aaa;
      position: absolute;
      right: 1rem;
      top: 1rem;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
    }

    .close:hover {
      color: black;
    }

    .snowflake {
      position: fixed;
      top: -2rem;
      z-index: 999;
      color: white;
      animation: fall linear infinite;
      user-select: none;
      pointer-events: none;
    }

    @keyframes fall {
      to {
        transform: translateY(100vh);
        opacity: 0;
      }
    }
  </style>
</head>

      <h3>Frozen Mango Chunks</h3>
      <p>₹100 per pack</p>
      <button onclick="addToCart('Frozen Mango Chunks', 100)">Add to Cart</button>
    </div>
  </div>

  <div style="text-align: center;">
    <button class="view-cart-btn" onclick="showCart()">View Cart</button>
    <button class="view-cart-btn" onclick="toggleSnow()">Toggle Snow</button>
   
  </div>

  <div class="back-home">
    <a href="jyo.html">⬅ Back to Home</a>
  </div>

  <!-- Modal for Cart -->
  <div id="cartModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeCart()">&times;</span>
      <h2>Your Cart</h2>
      <div id="cartItems"></div>
      <button class="view-cart-btn" onclick="checkout()">Checkout</button>
    </div>
  </div>

  <!-- Scripts -->
  <script>
    const cart = [];
    let snowEnabled = true;
    let musicPlaying = false;
    const audio = new Audio('winter_music.mp3');
    audio.loop = true;
    audio.volume = 0.5;

    function addToCart(name, price) {
      const qty = prompt(`Enter quantity for ${name}:`);
      const quantity = parseInt(qty);
      if (!isNaN(quantity) && quantity > 0) {
        cart.push({ name, price, quantity });
        alert(`${quantity} ${name}(s) added to cart!`);
      } else {
        alert("Please enter a valid number.");
      }
    }

    function showCart() {
      const cartModal = document.getElementById('cartModal');
      const cartItems = document.getElementById('cartItems');
      cartItems.innerHTML = "";

      if (cart.length === 0) {
        cartItems.innerHTML = "<p>Your cart is empty.</p>";
      } else {
        cart.forEach(item => {
          const total = item.price * item.quantity;
          cartItems.innerHTML += `<p><strong>${item.name}</strong> - Quantity: ${item.quantity} | Total: ₹${total}</p>`;
        });
      }

      cartModal.style.display = "block";
    }

    function closeCart() {
      document.getElementById('cartModal').style.display = "none";
    }

    function checkout() {
      if (cart.length === 0) {
        alert("Cart is empty!");
      } else {
        alert("Thank you for your purchase!");
        cart.length = 0;
        closeCart();
      }
    }

    function toggleSnow() {
      snowEnabled = !snowEnabled;
    }

    function toggleMusic() {
      if (!musicPlaying) {
        audio.play();
        musicPlaying = true;
      } else {
        audio.pause();
        musicPlaying = false;
      }
    }

    // Snowflake animation
    setInterval(() => {
      if (!snowEnabled) return;

      const snowflake = document.createElement('div');
      snowflake.classList.add('snowflake');
      snowflake.innerHTML = '❄️';
      snowflake.style.left = Math.random() * window.innerWidth + 'px';
      snowflake.style.animationDuration = 3 + Math.random() * 5 + 's';
      snowflake.style.fontSize = 10 + Math.random() * 20 + 'px';
      document.body.appendChild(snowflake);

      setTimeout(() => {
        snowflake.remove();
      }, 8000);
    }, 200);
  </script>
