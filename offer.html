<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Frozen Product Offers</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f0f8ff;
      color: #333;
    }

    h1 {
      text-align: center;
      padding: 30px 0;
      color: #004d4d;
    }

    .offers {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 40px;
      padding: 20px;
    }

    .offer-card {
      width: 350px;
      background-color: #ffffff;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    .offer-card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
    }

    .offer-details {
      padding: 20px;
    }

    .offer-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #006666;
    }

    .offer-price {
      font-size: 18px;
      color: #008080;
    }

    .offer-price del {
      color: #999;
      margin-left: 10px;
    }
  </style>
</head>
<body>

  <h1>Frozen Product Offers</h1>

  <div class="offers">
    <div class="offer-card">
      <img src="piza.jpeg" alt="Frozen Pizza">
      <div class="offer-details">
        <div class="offer-title">Frozen Cheese Pizza</div>
        <div class="offer-price">₹199 <del>₹299</del></div>
      </div>
    </div>

    <div class="offer-card">
      <img src="log44.jpg" alt="Frozen Berries">
      <div class="offer-details">
        <div class="offer-title">Frozen Mixed Berries</div>
        <div class="offer-price">₹149 <del>₹229</del></div>
      </div>
    </div>

    <div class="offer-card">
      <img src="fries.jpg" alt="Frozen Fries">
      <div class="offer-details">
        <div class="offer-title">Frozen Crispy Fries</div>
        <div class="offer-price">₹89 <del>₹129</del></div>
      </div>
    </div>
  </div>

</body>
</html>
