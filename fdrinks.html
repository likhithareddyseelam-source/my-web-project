<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Frozen Drinks</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
      background: linear-gradient(-45deg, #9f5de2, #5dc7e2, #5de2aa, #ff6bd6);
      background-size: 400% 400%;
      animation: gradientFlow 12s ease infinite;
      position: relative;
      padding-bottom: 100px;
    }

    @keyframes gradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    header {
      text-align: center;
      padding: 40px 20px 10px;
      font-size: 42px;
      font-weight: bold;
      text-shadow: 2px 2px 10px #00000070;
      animation: fadeIn 1.5s ease;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 40px;
      padding: 40px;
      max-width: 1200px;
      margin: auto;
      animation: slideUp 2s ease;
    }

    .card {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 25px;
      text-align: center;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-10px) scale(1.03);
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    }

    .card img {
      width: 100%;
      border-radius: 15px;
      margin-bottom: 15px;
    }

    .card h3 {
      margin: 10px 0;
      font-size: 22px;
      color: #fff;
      text-shadow: 1px 1px 5px #000;
    }

    .card button {
      margin-top: 10px;
      padding: 10px 20px;
      background-color: #fff;
      color: #d63384;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s ease;
    }

    .card button:hover {
      transform: scale(1.05);
    }

    .home-btn,
    #viewCartBtn {
      display: inline-block;
      margin: 20px 10px 0;
      padding: 12px 30px;
      font-size: 18px;
      background-color: #fff;
      color: #d63384;
      font-weight: bold;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      text-decoration: none;
      transition: all 0.3s ease;
    }

    #viewCartBtn {
      color: #6f42c1;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    footer {
      text-align: center;
      padding: 25px 20px;
      color: #ffffffbb;
      font-size: 16px;
      position: relative;
    }

    @media (max-width: 768px) {
      header {
        font-size: 30px;
      }
      .container {
        padding: 20px;
      }
    }

    /* Snow animation */
    .snow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 999;
    }

    .snowflake {
      position: absolute;
      top: -10px;
      color: #fff;
      font-size: 1em;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% {
        transform: translateY(0);
        opacity: 1;
      }
      100% {
        transform: translateY(100vh);
        opacity: 0;
      }
    }

    /* Cart popup */
    #cartPopup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255,255,255,0.95);
      color: #333;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      z-index: 1000;
      display: none;
      width: 320px;
    }

    #cartPopup h4 {
      margin-bottom: 10px;
      text-align: center;
    }

    #cartPopup ul {
      padding-left: 20px;
      margin-bottom: 15px;
    }

    #cartPopup button {
      padding: 8px 20px;
      border-radius: 20px;
      border: none;
      background: #d63384;
      color: white;
      font-weight: bold;
      cursor: pointer;
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <header>✨ Frozen Drinks Paradise ✨</header>

  <div class="container">
    <div class="card">
      <img src="https://tse1.mm.bing.net/th?id=OIP.shU8XDNuiL_V_4UPRgzndwHaEK&pid=Api&P=0&h=180" alt="Smoothie">
      <h3>Berry Blast Smoothie</h3>
      <button onclick="addToCart('Berry Blast Smoothie')">Add to Cart</button>
    </div>
    <div class="card">
      <img src="https://tse4.mm.bing.net/th?id=OIP.BO3TlifKgJ1HWKbdwlinMwHaE7&pid=Api&P=0&h=180" alt="Iced Tea">
      <h3>Tropical Iced Tea</h3>
      <button onclick="addToCart('Tropical Iced Tea')">Add to Cart</button>
    </div>
    <div class="card">
      <img src="https://tse3.mm.bing.net/th?id=OIP.v4hRfW3W4o4Nry57Hz76bAHaE7&pid=Api&P=0&h=180" alt="Frozen Lemonade">
      <h3>Frozen Lemonade</h3>
      <button onclick="addToCart('Frozen Lemonade')">Add to Cart</button>
    </div>
    <div class="card">
      <img src="https://tse2.mm.bing.net/th?id=OIP.tpDshpLmmMrJW57XrrxbzAHaJ8&pid=Api&P=0&h=180" alt="Fruit Slush">
      <h3>Fruit Slush</h3>
      <button onclick="addToCart('Fruit Slush')">Add to Cart</button>
    </div>
  </div>

  <div style="text-align: center;">
    <a class="home-btn" href="jyo.html">← Back to Home</a>
    <button id="viewCartBtn" onclick="showCart()">🛒 View Cart</button>
  </div>

  <!-- Cart Popup -->
  <div id="cartPopup">
    <h4>🛍️ Your Cart</h4>
    <ul id="cartItems"></ul>
    <p id="cartTotal"></p>
    <button onclick="hideCart()">Close</button>
  </div>

  <!-- Snow Container -->
  <div class="snow" id="snowContainer"></div>

  <footer>© 2025 FrozenApp. All rights reserved.</footer>

  <script>
    const cart = [];

    function addToCart(item) {
      cart.push(item);
      alert(item + " added to cart!");
    }

    function showCart() {
      const list = document.getElementById('cartItems');
      list.innerHTML = '';
      const itemCount = {};

      cart.forEach(item => {
        itemCount[item] = (itemCount[item] || 0) + 1;
      });

      for (let item in itemCount) {
        const li = document.createElement('li');
        li.textContent = `${item} x${itemCount[item]}`;
        list.appendChild(li);
      }

      document.getElementById('cartTotal').textContent = `Total Items: ${cart.length}`;
      document.getElementById('cartPopup').style.display = 'block';
    }

    function hideCart() {
      document.getElementById('cartPopup').style.display = 'none';
    }

    // Snow effect
    function createSnow() {
      const snowContainer = document.getElementById('snowContainer');
      for (let i = 0; i < 60; i++) {
        const snowflake = document.createElement('div');
        snowflake.classList.add('snowflake');
        snowflake.textContent = '❄️';
        snowflake.style.left = Math.random() * 100 + 'vw';
        snowflake.style.animationDuration = (5 + Math.random() * 5) + 's';
        snowflake.style.fontSize = (10 + Math.random() * 20) + 'px';
        snowflake.style.opacity = Math.random();
        snowContainer.appendChild(snowflake);
      }
    }

    createSnow();
  </script>

</body>
</html>
