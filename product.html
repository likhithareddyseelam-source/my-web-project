<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Frozen Products</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(to bottom, #c9f2ff, #e0f7fa);
      overflow-x: hidden;
    }

    h1 {
      color: #004d40;
      text-align: center;
      margin: 40px 0 20px;
      font-size: 3rem;
      animation: fadeIn 1.5s ease-in-out;
    }

    .product-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 40px;
      padding: 30px;
      z-index: 1;
      position: relative;
    }

    .card {
      background: white;
      border-radius: 25px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
      padding: 25px;
      width: 280px;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      animation: slideIn 1s ease-in-out;
    }

    .card:hover {
      transform: scale(1.07);
      box-shadow: 0 15px 30px rgba(0,0,0,0.25);
    }

    .card img {
      width: 200px;
      height: 200px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 20px;
      border: 4px solid #b2ebf2;
    }

    .product-name {
      font-size: 24px;
      font-weight: bold;
      color: #00796b;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 10;
      left: 0; top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.6);
    }

    .modal-content {
      background: #ffffff;
      margin: 5% auto;
      padding: 40px;
      border-radius: 25px;
      width: 90%;
      max-width: 700px;
      text-align: center;
      animation: fadeIn 0.5s ease;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }

.home-btn {
      display: inline-block;
      margin: 20px 10px;
      padding: 14px 40px;
      font-size: 18px;
      background-color: #fff;
      color: #d63384;
      font-weight: bold;
      border: 2px solid #ff69b4;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
      text-decoration: none;
    }
    .modal-content img {
      width: 220px;
      height: 220px;
      object-fit: cover;
      border-radius: 20px;
      border: 3px solid #81d4fa;
      margin-bottom: 25px;
    }

    .modal-content ul {
      text-align: left;
      font-size: 18px;
      color: #333;
      line-height: 1.6;
      padding: 0 20px;
    }

    .close-btn {
      margin-top: 30px;
      display: inline-block;
      background: #00796b;
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    .close-btn:hover {
      background: #004d40;
    }

    /* Snowfall effect */
    .snow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background-image: url('b1.jpg');
      z-index: 0;
      animation: snowfall 50s linear infinite;
      opacity: 0.3;
    }

    @keyframes snowfall {
      0% { background-position: 0 0; }
      100% { background-position: 1000px 1000px; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="snow"></div>

  <h1>Explore Our Frozen Products</h1>

  <div class="product-container">
    <div class="card" onclick="showModal('Ice Cream', 'ice.jpeg', ['Rich in calcium for strong bones', 'Boosts mood instantly', 'Great for all ages', 'Perfect summer refreshment'])">
      <img src="Ice.jpeg" alt="Ice Cream">
      <div class="product-name">Ice Cream</div>
    </div>

    <div class="card" onclick="showModal('Frozen Pizza', 'piza.jpeg', ['Quick meal option', 'Loaded with cheese and toppings', 'Long shelf life', 'Perfect party treat'])">
      <img src="piza.jpeg" alt="Frozen Pizza">
      <div class="product-name">Frozen Pizza</div>
    </div>

    <div class="card" onclick="showModal('Frozen Vegetables', 'veg.jpeg', ['Packed with nutrients', 'No preservatives', 'Easy to cook', 'Saves chopping time'])">
      <img src="veg.jpeg" alt="Frozen Vegetables">
      <div class="product-name">Frozen Vegetables</div>
    </div>

    <div class="card" onclick="showModal('Frozen Meat', 'frmeat.jpeg', ['High in protein', 'Safely preserved', 'Ideal for all recipes', 'Perfect for storage'])">
      <img src="frmeat.jpeg" alt="Frozen Meat">
      <div class="product-name">Frozen Meat</div>
    </div>
  </div>

 <div style="text-align:center">
    <a class="home-btn" href="jyo.html">← Back to Home</a>
 
  </div
  <!-- Modal -->
  <div id="productModal" class="modal">
    <div class="modal-content">
      <h2 id="modalTitle"></h2>
      <img id="modalImage" src="" alt="">
      <ul id="modalAdvantages"></ul>
      <div class="close-btn" onclick="closeModal()">← Return to Menu</div>
    </div>
  </div>

  <script>
    function showModal(title, imageSrc, advantages) {
      document.getElementById("modalTitle").innerText = title;
      document.getElementById("modalImage").src = imageSrc;

      const list = document.getElementById("modalAdvantages");
      list.innerHTML = "";
      advantages.forEach(item => {
        const li = document.createElement("li");
        li.textContent = "✅ " + item;
        list.appendChild(li);
      });

      document.getElementById("productModal").style.display = "block";
    }

    function closeModal() {
      document.getElementById("productModal").style.display = "none";
    }

    window.onclick = function(event) {
      const modal = document.getElementById("productModal");
      if (event.target == modal) {
        closeModal();
      }
    };
  </script>
</body>
</html>
